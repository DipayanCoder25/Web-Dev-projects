<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🏦 Bank Management System</h1>

        <div class="bank-box">

            <h2>Welcome to My Bank</h2>

            <p id="message">
                Choose an option
            </p>

            <button onclick="myAccount.showBalance()">
                See Balance
            </button>

            <div class="input-box">

                <input type="number" id="depositAmount" placeholder="Enter deposit amount">

                <button onclick="depositMoney()">
                    Deposit
                </button>

            </div>

            <div class="input-box">

                <input type="number" id="withdrawAmount" placeholder="Enter withdraw amount">

                <button onclick="withdrawMoney()">
                    Withdraw
                </button>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>

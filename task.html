<!DOCTYPE html>
<html>

<head>
    <title>CSS Layout</title>

    <style>
        body {
            margin: 10px;
        }

        /* Header */
        .header {
            background-color: #2196d2;
            color: white;
            height: 40px;
            text-align: center;
            padding-top: 10px;
        }

        /* Sidebar + Content 2 */
        .main {
            display: flex;
            margin-top: 5px;
        }

        /* Left side */
        .left {
            width: 12%;
            margin-right: 5px;
        }

        /* Sidebar */
        .sidebar {
            background-color: #9b6bb5;
            color: white;
            height: 90px;
            text-align: center;
            padding-top: 10px;
        }

        /* Content 3 */
        .content3 {
            background-color: tomato;
            color: white;
            height: 25px;
            margin-top: 5px;
            text-align: center;
        }

        /* Content 2 */
        .content2 {
            background-color: orange;
            color: white;
            width: 88%;
            height: 100px;
            text-align: center;
            padding-top: 10px;
        }

        /* Footer */
        .footer {
            background-color: #34495e;
            color: white;
            height: 15px;
            margin-top: 5px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="header">
        Header
    </div>

    <div class="main">

        <div class="left">
            <div class="sidebar">
                Sidebar
            </div>

            <div class="content3">
                Content 3
            </div>
        </div>

        <div class="content2">
            Content 2
        </div>

    </div>

    <div class="footer">
        Footer
    </div>

</body>

</html>
